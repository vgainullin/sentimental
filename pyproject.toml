[project]
name = "sentimental"
version = "0.1.0"
description = "Harvest, mine, and embed mathematicians' papers for style and sentiment analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.34",
  "huggingface-hub>=0.30",
  "lxml>=5",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "pymupdf>=1.24",
  "pyyaml>=6",
  "rapidfuzz>=3",
  "requests>=2.31",
]

[project.optional-dependencies]
# shortcut: torch resolves from PyPI (CUDA wheels, ~2.5 GB on CPU runners); move to the
# pytorch-cpu index via [tool.uv.sources] when embed-cpu install time matters.
embed = ["adapters>=1.0", "sentence-transformers>=3.0", "torch>=2.4", "transformers>=4.44"]
faiss = ["faiss-cpu>=1.8"]

[project.scripts]
msp = "msp.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "lxml-stubs>=0.5",
  "pre-commit>=3.7",
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.6",
  "types-pyyaml>=6",
  "types-requests>=2.31",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "PTH"]
ignore = ["RUF001", "RUF003"]          # math symbols (⟨math⟩, τ) are intentional

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PTH", "SIM115", "E501", "RUF012", "RUF005"]

[tool.mypy]
# AGENTS.md: `pyright (strict) or mypy --strict`. mypy: pandas row access is untyped
# (Any) rather than a hard error, which keeps strictness on our own code.
strict = true
python_version = "3.12"
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pandas.*", "pyarrow.*", "boto3.*", "botocore.*", "huggingface_hub.*", "pymupdf.*",
          "rapidfuzz.*", "torch.*", "transformers.*", "adapters.*", "sentence_transformers.*",
          "faiss.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs network or models; excluded from CI"]
addopts = "-m 'not slow'"
