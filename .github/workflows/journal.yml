name: journal

on:
  push:
    branches: [main]
    paths: [JOURNAL.md, "journal/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stage journal only
        run: |
          mkdir -p site
          cp JOURNAL.md site/index.md
          cp -r journal site/journal
          printf 'title: %s journal\n' "${GITHUB_REPOSITORY#*/}" > site/_config.yml
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: _site
      - uses: actions/upload-pages-artifact@v5
      - id: deploy
        uses: actions/deploy-pages@v5
