[project]
name = "sentimental"
version = "0.1.0"
description = "Harvest, mine, and embed mathematicians' papers for style and sentiment analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.43.112",
  "huggingface-hub>=2.2.0",
  "lxml>=6.1.3",
  "numpy>=2.5.4",
  "pandas>=3.0.6",
  "pyarrow>=26.0.0",
  "pymupdf>=1.28.2",
  "pyyaml>=6.0.3",
  "rapidfuzz>=3.14.6",
  "requests>=2.34.2",
]

[project.optional-dependencies]
# shortcut: torch resolves from PyPI (CUDA wheels, ~2.5 GB on CPU runners); move to the
# pytorch-cpu index via [tool.uv.sources] when embed-cpu install time matters.
embed = ["adapters>=1.3.0", "sentence-transformers>=6.1.0", "torch>=2.14.1", "transformers>=5.19.0"]
faiss = ["faiss-cpu>=1.15.1"]

[project.scripts]
msp = "msp.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.169.0",
  "lxml-stubs>=0.5.1",
  "pre-commit>=4.7.0",
  "mypy>=2.4.0",
  "pytest>=9.1.1",
  "ruff>=0.17.0",
  "types-pyyaml>=6.0.12.20260906",
  "types-requests>=2.33.0.20261006",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "PTH"]
ignore = ["RUF001", "RUF003"]          # math symbols (⟨math⟩, τ) are intentional

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PTH", "SIM115", "E501", "RUF012", "RUF005"]

[tool.mypy]
# AGENTS.md: `pyright (strict) or mypy --strict`. mypy: pandas row access is untyped
# (Any) rather than a hard error, which keeps strictness on our own code.
strict = true
python_version = "3.12"
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pandas.*", "pyarrow.*", "boto3.*", "botocore.*", "huggingface_hub.*", "pymupdf.*",
          "rapidfuzz.*", "torch.*", "transformers.*", "adapters.*", "sentence_transformers.*",
          "faiss.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs network or models; excluded from CI"]
addopts = "-m 'not slow'"
