name: pipeline
# Weekly full refresh, or manual for chosen authors/stages.
#   plan → shard (one job per author, GROBID alongside) → merge → embed (CPU or Lambda GPU)
#   → index (Vectorize) → report (wiki Data-Status) ; failures open an issue.
on:
  schedule:
    - cron: "17 6 * * 1"          # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      authors:
        description: Space-separated author keys (blank = all in authors.yaml)
        default: ""
      stages:
        description: Per-author stages, in order
        default: harvest fetch parse link chunk
      embed:
        description: Where to embed
        type: choice
        options: [auto, cpu, lambda, skip]
        default: auto
      index:
        description: Upload chunk vectors to Vectorize
        type: boolean
        default: true

permissions:
  contents: read
concurrency:
  group: pipeline
  cancel-in-progress: false        # never kill a run mid-upload

env:
  PYTHONUNBUFFERED: "1"
  MSP_MAILTO: ${{ vars.MSP_MAILTO }}
  OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ vars.R2_BUCKET }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET: ${{ vars.HF_DATASET }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      keys: ${{ steps.plan.outputs.keys }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required configuration
        run: |
          missing=()
          for v in CF_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET HF_TOKEN HF_DATASET; do
            [[ -n "${!v}" ]] || missing+=("$v")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing secrets/variables: ${missing[*]}. See the wiki Runbook."
            exit 1
          fi
      - uses: ./.github/actions/setup-msp
      - id: plan
        env:
          AUTHORS: ${{ inputs.authors }}
        run: |
          python scripts/plan_shards.py authors.yaml >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        key: ${{ fromJSON(needs.plan.outputs.keys) }}
    services:
      grobid:
        image: grobid/grobid:0.9.1-crf
        ports: ["8070:8070"]
    env:
      KEY: ${{ matrix.key }}
      STAGES: ${{ inputs.stages || 'harvest fetch parse link chunk' }}
      MSP_GROBID_URL: http://localhost:8070
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-msp
      - name: Restore shard state from R2 (PDFs, TEI, HTTP cache, tables)
        run: msp --shard "$KEY" sync r2-pull
      - name: Wait for GROBID
        run: |
          for _ in $(seq 60); do
            curl -fs http://localhost:8070/api/isalive && exit 0
            sleep 5
          done
          echo "::warning::GROBID did not come up; parse falls back to plain text"
      - name: Run stages
        run: |
          for stage in $STAGES; do
            echo "::group::$stage"
            msp --shard "$KEY" "$stage"
            echo "::endgroup::"
          done
      - name: Save downloads to R2
        if: always()                # keep paid API responses even if a stage failed
        run: msp --shard "$KEY" sync r2-push --new-only    # never replace with partial state
      - name: Save shard tables to R2
        if: success()               # only a complete run may replace tables in R2
        run: msp --shard "$KEY" sync r2-push --overwrite   # tables change every run
      - name: Summary
        if: always()
        run: |
          {
            echo "### $KEY"
            msp --shard "$KEY" status || true
          } | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

  merge:
    needs: shard
    if: ${{ !cancelled() && needs.shard.result != 'skipped' }}
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-msp
      - name: Pull every shard's tables
        run: msp sync r2-pull --prefix shards --include '*/tables/*'
      - run: msp merge
      - run: msp sync hf-push --what tables
      - name: Choose where to embed
        id: mode
        env:
          REQUESTED: ${{ inputs.embed || 'auto' }}
          THRESHOLD: ${{ vars.EMBED_GPU_THRESHOLD || '20000' }}
          HAS_LAMBDA: ${{ secrets.LAMBDA_API_KEY != '' && secrets.LAMBDA_SSH_PRIVATE_KEY != '' }}
        run: |
          n=$(python -c "import pandas as pd; print(len(pd.read_parquet('data/tables/chunks.parquet')))" 2>/dev/null || echo 0)
          mode="$REQUESTED"
          if [[ "$mode" == auto ]]; then
            if [[ "$HAS_LAMBDA" == true && "$n" -gt "$THRESHOLD" ]]; then mode=lambda; else mode=cpu; fi
          fi
          if [[ "$mode" == lambda && "$HAS_LAMBDA" != true ]]; then
            echo "::warning::Lambda secrets missing; embedding on CPU"; mode=cpu
          fi
          echo "chunks=$n → embed on $mode" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  embed-cpu:
    needs: merge
    if: ${{ !cancelled() && needs.merge.outputs.mode == 'cpu' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-msp
        with:
          extras: embed
      - run: msp sync hf-pull --what tables
      - run: msp embed
      - run: msp sync hf-push --what emb

  embed-lambda:
    needs: merge
    if: ${{ !cancelled() && needs.merge.outputs.mode == 'lambda' }}
    uses: ./.github/workflows/embed-lambda.yml
    secrets: inherit

  index:
    needs: [merge, embed-cpu, embed-lambda]
    if: >-
      ${{ !cancelled() && needs.merge.result == 'success'
          && (needs.embed-cpu.result == 'success' || needs.embed-lambda.result == 'success')
          && (github.event_name == 'schedule' || inputs.index) }}
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-msp
        with:
          extras: embed
      - run: msp sync hf-pull --what tables emb
      - name: Workers AI and local BGE must agree before upload
        run: msp parity-check
      - run: msp vectorize-upsert --overwrite --index "${{ vars.VECTORIZE_INDEX || 'math-style-chunks' }}"

  report:
    needs: [merge, embed-cpu, embed-lambda, index]
    if: ${{ !cancelled() && needs.merge.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write                 # push to the wiki
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-msp
      - run: msp sync hf-pull --what tables emb
      - name: Author similarity features
        run: |
          if [[ -f data/emb/papers.npy ]]; then msp profile; fi
          msp sync hf-push --what tables
      - name: Data-Status page
        run: |
          mkdir -p /tmp/wiki
          msp report --out /tmp/wiki/Data-Status.md
          cat /tmp/wiki/Data-Status.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_wiki.sh /tmp/wiki "data status after run ${{ github.run_id }}"

  on-failure:
    needs: [plan, shard, merge, embed-cpu, embed-lambda, index, report, reap]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the pipeline-failure issue
        run: |
          gh label create pipeline-failure --repo "$GITHUB_REPOSITORY" --color B60205 2>/dev/null || true
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --label pipeline-failure --state open --json number -q '.[0].number')
          if [[ -n "$n" ]]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label pipeline-failure \
              --title "Pipeline failed" --body "Run: $RUN_URL. Close this once fixed; the next failure opens a new one."
          fi

  reap:
    needs: [embed-lambda]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-msp
      - name: Terminate any orphaned Lambda instances from finished runs
        env:
          LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$LAMBDA_API_KEY" ]]; then echo "no Lambda key; nothing to reap"; exit 0; fi
          # embed-lambda is done, so this run's own instance counts as finished
          python scripts/lambda_gpu.py reap --repo "$GITHUB_REPOSITORY" --finished-run "$GITHUB_RUN_ID"
